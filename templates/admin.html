<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Управление — Ремонт</title>
<style>
  :root {
    --bg: #f5f3ef; --card: #fff; --accent: #5c6bc0; --accent2: #e8eaf6;
    --text: #2d2d2d; --muted: #888; --border: #e0ddd6; --shadow: 0 2px 12px rgba(0,0,0,.08);
    --danger: #e53935;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text); }

  header {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 16px 24px; display: flex; align-items: center; gap: 16px;
    box-shadow: var(--shadow);
  }
  header h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
  header a { color: var(--muted); text-decoration: none; font-size: .9rem; }
  header a:hover { color: var(--accent); }

  main { max-width: 900px; margin: 0 auto; padding: 32px 16px; display: grid; gap: 24px; }

  .card {
    background: var(--card); border-radius: 14px;
    box-shadow: var(--shadow); padding: 24px;
  }
  .card h2 { font-size: 1.1rem; margin-bottom: 16px; font-weight: 700; }

  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; margin-top: 12px; }
  input, select, textarea {
    width: 100%; padding: 10px 14px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: .95rem; outline: none; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 60px; }

  .btn {
    background: var(--accent); color: #fff; border: none;
    padding: 10px 22px; border-radius: 8px; font-size: .95rem;
    cursor: pointer; font-weight: 600; transition: opacity .15s; margin-top: 14px;
  }
  .btn:hover { opacity: .88; }
  .btn-danger { background: var(--danger); }
  .btn-sm { padding: 6px 12px; font-size: .8rem; margin-top: 0; }

  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th { text-align: left; padding: 8px 12px; border-bottom: 2px solid var(--border); color: var(--muted); font-weight: 600; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }

  .img-preview { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; background: var(--accent2); }
  .img-placeholder { width: 48px; height: 48px; border-radius: 6px; background: var(--accent2); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }

  .edit-inline input { padding: 4px 8px; font-size: .85rem; }

  .category-header { font-size: 1rem; font-weight: 700; color: var(--accent); background: var(--accent2); padding: 8px 12px; }

  .hint { font-size: .78rem; color: var(--muted); margin-top: 4px; }

  .tab-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab { padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: .9rem; font-weight: 600;
         border: 1.5px solid var(--border); background: var(--card); color: var(--muted); }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
</style>
</head>
<body>
<header>
  <h1>⚙ Управление</h1>
  <a href="/">← На главную</a>
</header>

<main>
  <div class="card">
    <h2>Добавить новую категорию</h2>
    <form method="post" action="/admin/add_category">
      <label>Название категории</label>
      <input type="text" name="name" placeholder="Например: Кухня" required>
      <button type="submit" class="btn">Создать</button>
    </form>
  </div>

  <div class="card">
    <h2>Добавить вариант</h2>
    <form method="post" action="/admin/add_product">
      <label>Категория</label>
      <select name="category_id" required>
        {% for cat in cats %}
        <option value="{{ cat['id'] }}">{{ cat['name'] }}</option>
        {% endfor %}
      </select>

      <label>Название товара</label>
      <input type="text" name="name" placeholder="Тумба с раковиной…" required>

      <label>Ссылка на товар</label>
      <input type="url" name="url" placeholder="https://santehnika-online.ru/...">

      <label>Цена</label>
      <input type="text" name="price" placeholder="12 500 ₽">

      <label>Ссылка на фото (URL картинки)</label>
      <input type="url" name="image_url" placeholder="https://…/photo.jpg">
      <p class="hint">Открой страницу товара → ПКМ на фото → «Копировать адрес изображения»</p>

      <button type="submit" class="btn">Добавить</button>
    </form>
  </div>

  <div class="card">
    <h2>Все варианты</h2>
    <table>
      <thead>
        <tr>
          <th style="width:56px"></th>
          <th>Название</th>
          <th>Цена</th>
          <th>Ссылка</th>
          <th style="width:80px"></th>
        </tr>
      </thead>
      <tbody id="products-table">
        {% for cat in cats %}
        <tr>
          <td colspan="5" class="category-header">{{ cat['name'] }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <div id="products-container"></div>
  </div>
</main>

<script>
// Load products dynamically from the page data embedded below
const catsData = {{ cats_json|safe }};

function renderProducts(products, catName, container) {
  products.forEach(p => {
    const row = document.createElement('tr');
    row.id = 'row-' + p.id;
    row.innerHTML = `
      <td>
        ${p.image_url
          ? `<img class="img-preview" src="${p.image_url}" onerror="this.outerHTML='<div class=\\'img-placeholder\\'>🛁</div>'">`
          : `<div class="img-placeholder">🛁</div>`}
      </td>
      <td>
        <div id="name-${p.id}">${p.name}</div>
      </td>
      <td>
        <div id="price-${p.id}">${p.price || '—'}</div>
      </td>
      <td>
        ${p.url ? `<a href="${p.url}" target="_blank" style="color:#5c6bc0;font-size:.8rem">Открыть ↗</a>` : '—'}
      </td>
      <td>
        <button class="btn btn-sm" onclick="openEdit(${p.id}, '${escHtml(p.name)}', '${escHtml(p.price||'')}', '${escHtml(p.image_url||'')}')">✏</button>
        <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})" style="margin-left:4px">✕</button>
      </td>
    `;
    container.appendChild(row);
  });
}

function escHtml(s) { return s.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

// Edit modal
let editId = null;
function openEdit(id, name, price, imageUrl) {
  editId = id;
  const newName = prompt('Название:', name);
  if (newName === null) return;
  const newPrice = prompt('Цена:', price);
  if (newPrice === null) return;
  const newImg = prompt('URL фото:', imageUrl);
  if (newImg === null) return;

  fetch('/admin/edit_product/' + id, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: newName, price: newPrice, image_url: newImg})
  }).then(() => location.reload());
}

function deleteProduct(id) {
  if (!confirm('Удалить этот вариант?')) return;
  fetch('/admin/delete_product/' + id, {method: 'POST'})
    .then(() => {
      document.getElementById('row-' + id)?.remove();
    });
}

// Load products for each category
(async function() {
  const tbody = document.getElementById('products-table');
  // Clear placeholder rows
  tbody.innerHTML = '';

  for (const cat of catsData) {
    const headRow = document.createElement('tr');
    headRow.innerHTML = `<td colspan="5" class="category-header">${cat.name}</td>`;
    tbody.appendChild(headRow);

    const resp = await fetch('/api/products/' + cat.id);
    const products = await resp.json();
    renderProducts(products, cat.name, tbody);
  }
})();
</script>
</body>
</html>
